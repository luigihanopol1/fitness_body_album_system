<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ object.title }}</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            min-height:100vh;

            background:
            linear-gradient(rgba(10,20,30,0.55),
            rgba(10,20,30,0.65)),

            url('{{ object.image.url }}');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:40px 20px;

            overflow-y:auto;

            color:white;

        }

        body::before{

            content:'';

            position:fixed;
            inset:0;

            backdrop-filter:blur(10px);

            z-index:-1;

        }

        .container{

            width:100%;
            max-width:820px;

            border-radius:30px;

            overflow:hidden;

            background:rgba(255,255,255,0.12);

            backdrop-filter:blur(20px);

            border:1px solid rgba(255,255,255,0.15);

            box-shadow:
            0 8px 35px rgba(0,0,0,0.35);

            animation:fadeIn 1s ease;

        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .image-section{

            width:100%;

            overflow:hidden;

        }

        .image-section img{

            width:100%;

            height:420px;

            object-fit:cover;

            display:block;

        }

        .content{

            padding:28px;

        }

        .title{

            font-size:48px;

            margin-bottom:15px;

            text-shadow:0 10px 30px rgba(0,0,0,0.5);

        }

        .meta{

            font-size:14px;

            line-height:28px;

            color:#eee;

            margin-bottom:20px;

        }

        .description{

            font-size:15px;

            line-height:30px;

            color:#f5f5f5;

            margin-bottom:30px;

        }

        .buttons{

            display:flex;

            gap:15px;

            flex-wrap:wrap;

        }

        .btn{

            padding:12px 22px;

            border-radius:50px;

            text-decoration:none;

            font-size:14px;
            font-weight:600;

            transition:0.4s;

            border:none;

            color:white;

            backdrop-filter:blur(10px);

        }

        .back-btn{

            background:rgba(255,255,255,0.18);

            border:1px solid rgba(255,255,255,0.15);

        }

        .edit-btn{

            background:linear-gradient(
            135deg,
            #8fd3f4,
            #84fab0
            );

            color:#222;

        }

        .delete-btn{

            background:linear-gradient(
            135deg,
            #ff758c,
            #ff7eb3
            );

        }

        .btn:hover{

            transform:translateY(-5px) scale(1.03);

        }

        @media(max-width:768px){

            .title{

                font-size:36px;

            }

            .content{

                padding:22px;

            }

            .buttons{

                flex-direction:column;

            }

            .btn{

                text-align:center;

            }

            .image-section img{

                height:280px;

            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="image-section">

            <img src="{{ object.image.url }}">

        </div>

        <div class="content">

            <h1 class="title">
                {{ object.title }}
            </h1>

           

            <div class="description">

                {{ object.description }}

            </div>

            <div class="buttons">

                <a href="/" class="btn back-btn">
                    ← Back Home
                </a>

                <a href="/{{ object.id }}/update/" class="btn edit-btn">
                     Edit Album
                </a>

                <a href="/{{ object.id }}/delete/" class="btn delete-btn">
                    🗑 Delete
                </a>

            </div>

        </div>

    </div>

</body>
</html>
