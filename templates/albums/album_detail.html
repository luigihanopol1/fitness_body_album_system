<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ object.title }}</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            background:
            linear-gradient(rgba(0,0,0,0.75),
            rgba(0,0,0,0.88)),

            url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=2070&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:40px;

            overflow-x:hidden;

        }

        .detail-card{

            width:100%;
            max-width:950px;

            background:rgba(20,20,20,0.78);

            backdrop-filter:blur(20px);

            border-radius:30px;

            overflow:hidden;

            border:1px solid rgba(255,255,255,0.08);

            box-shadow:0 8px 40px rgba(0,0,0,0.6);

            animation:fadeIn 1s ease;

        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .detail-image{

            width:100%;
            height:500px;

            overflow:hidden;

            background:black;

        }

        .detail-image img{

            width:100%;
            height:100%;

            object-fit:cover;

            display:block;

        }

        .detail-content{

            padding:40px;

        }

        .title{

            font-size:60px;

            font-weight:800;

            color:#ff3c3c;

            margin-bottom:20px;

        }

        .meta{

            color:#ddd;

            line-height:35px;

            font-size:17px;

            margin-bottom:25px;

        }

        .description{

            color:#f5f5f5;

            font-size:18px;

            line-height:38px;

            margin-bottom:40px;

        }

        .buttons{

            display:flex;
            gap:15px;

            flex-wrap:wrap;

        }

        .btn{

            padding:16px 30px;

            border-radius:50px;

            text-decoration:none;

            font-weight:700;

            transition:0.4s;

            font-size:16px;

        }

        .home-btn{

            background:rgba(255,255,255,0.08);

            color:white;

            border:1px solid rgba(255,255,255,0.08);

        }

        .home-btn:hover{

            background:#333;

            transform:translateY(-5px);

        }

        .edit-btn{

            background:linear-gradient(
            135deg,
            #ff7b00,
            #ffb300
            );

            color:white;

            box-shadow:0 8px 25px rgba(255,123,0,0.3);

        }

        .edit-btn:hover{

            transform:translateY(-5px);

        }

        .delete-btn{

            background:linear-gradient(
            135deg,
            #ff3c3c,
            #ff0000
            );

            color:white;

            box-shadow:0 8px 25px rgba(255,60,60,0.3);

        }

        .delete-btn:hover{

            transform:translateY(-5px);

        }

        @media(max-width:900px){

            .detail-image{

                height:350px;

            }

            .title{

                font-size:42px;

            }

        }

        @media(max-width:600px){

            .detail-content{

                padding:25px;

            }

            .title{

                font-size:35px;

            }

            .description{

                font-size:16px;

                line-height:30px;

            }

        }

    </style>

</head>

<body>

    <div class="detail-card">

        <div class="detail-image">

            <img src="{{ object.image.url }}">

        </div>

        <div class="detail-content">

            <div class="title">

                💪 {{ object.title }}

            </div>

            

            <div class="description">

                {{ object.description }}

            </div>

            <div class="buttons">

                <a href="/" class="btn home-btn">

                    ← Back Home

                </a>

                <a href="/{{ object.id }}/update/" class="btn edit-btn">

                    ✏️ Edit Progress

                </a>

                <a href="/{{ object.id }}/delete/" class="btn delete-btn">

                    🗑 Delete

                </a>

            </div>

        </div>

    </div>

</body>
</html>
