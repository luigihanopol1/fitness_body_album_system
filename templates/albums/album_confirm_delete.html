<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Album</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            min-height:100vh;

            background:
            linear-gradient(rgba(10,20,30,0.55),
            rgba(10,20,30,0.7)),

            url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;

            overflow-y:auto;

            color:white;

        }

        body::before{

            content:'';

            position:fixed;
            inset:0;

            backdrop-filter:blur(10px);

            z-index:-1;

        }

        .delete-container{

            width:100%;
            max-width:500px;

            padding:40px;

            border-radius:30px;

            background:rgba(255,255,255,0.12);

            backdrop-filter:blur(20px);

            border:1px solid rgba(255,255,255,0.15);

            box-shadow:
            0 8px 40px rgba(0,0,0,0.35);

            text-align:center;

            animation:fadeIn 1s ease;

        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .icon{

            font-size:70px;

            margin-bottom:20px;

            animation:float 3s ease-in-out infinite;

        }

        @keyframes float{

            0%{
                transform:translateY(0);
            }

            50%{
                transform:translateY(-10px);
            }

            100%{
                transform:translateY(0);
            }

        }

        h1{

            font-size:42px;

            margin-bottom:15px;

            text-shadow:0 10px 30px rgba(0,0,0,0.5);

        }

        p{

            font-size:16px;

            line-height:30px;

            color:#f5f5f5;

            margin-bottom:35px;

        }

        .buttons{

            display:flex;
            justify-content:center;
            gap:15px;

            flex-wrap:wrap;

        }

        .btn{

            padding:14px 24px;

            border:none;

            border-radius:50px;

            text-decoration:none;

            font-size:15px;
            font-weight:600;

            cursor:pointer;

            transition:0.4s;

            box-shadow:0 8px 20px rgba(0,0,0,0.25);

        }

        .delete-btn{

            background:linear-gradient(
            135deg,
            #ff758c,
            #ff7eb3
            );

            color:white;

        }

        .cancel-btn{

            background:rgba(255,255,255,0.18);

            color:white;

            border:1px solid rgba(255,255,255,0.15);

            backdrop-filter:blur(10px);

        }

        .btn:hover{

            transform:translateY(-5px) scale(1.03);

        }

        @media(max-width:600px){

            .delete-container{

                padding:30px;

            }

            h1{

                font-size:32px;

            }

            p{

                font-size:14px;
                line-height:26px;

            }

            .buttons{

                flex-direction:column;

            }

        }

    </style>

</head>

<body>

    <div class="delete-container">

        <div class="icon">
            🗑
        </div>

        <h1>Delete Album</h1>

        <p>
            Are you sure you want to remove this magical memory
            from your peaceful Ghibli scrapbook world?
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="buttons">

                <button type="submit" class="btn delete-btn">
                     Yes 
                </button>

                <a href="/" class="btn cancel-btn">
                    ← Cancel
                </a>

            </div>

        </form>

    </div>

</body>
</html>
