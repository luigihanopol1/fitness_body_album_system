<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Workout Progress</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            background:
            linear-gradient(rgba(0,0,0,0.75),
            rgba(0,0,0,0.88)),

            url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=2070&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;

            overflow:hidden;

        }

        .delete-box{

            width:100%;
            max-width:600px;

            background:rgba(20,20,20,0.78);

            backdrop-filter:blur(20px);

            border-radius:30px;

            padding:60px 40px;

            text-align:center;

            border:1px solid rgba(255,255,255,0.08);

            box-shadow:0 8px 40px rgba(0,0,0,0.6);

            animation:fadeIn 1s ease;

        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .icon{

            font-size:80px;

            margin-bottom:20px;

        }

        h1{

            color:#ff3c3c;

            font-size:55px;

            margin-bottom:25px;

            font-weight:800;

        }

        p{

            color:#ddd;

            font-size:20px;

            line-height:38px;

            margin-bottom:40px;

        }

        .buttons{

            display:flex;
            justify-content:center;
            gap:20px;

            flex-wrap:wrap;

        }

        .btn{

            padding:16px 35px;

            border:none;

            border-radius:50px;

            text-decoration:none;

            font-size:17px;

            font-weight:700;

            cursor:pointer;

            transition:0.4s;

        }

        .delete-btn{

            background:linear-gradient(
            135deg,
            #ff3c3c,
            #ff0000
            );

            color:white;

            box-shadow:0 8px 25px rgba(255,60,60,0.4);

        }

        .delete-btn:hover{

            transform:translateY(-5px);

            box-shadow:0 12px 35px rgba(255,60,60,0.6);

        }

        .cancel-btn{

            background:rgba(255,255,255,0.08);

            color:white;

            border:1px solid rgba(255,255,255,0.1);

        }

        .cancel-btn:hover{

            background:#333;

            transform:translateY(-5px);

        }

        @media(max-width:700px){

            .delete-box{

                padding:40px 25px;

            }

            h1{

                font-size:40px;

            }

            p{

                font-size:17px;

                line-height:30px;

            }

        }

    </style>

</head>

<body>

    <div class="delete-box">

        <div class="icon">
            🏋️
        </div>

        <h1>
            Delete Progress
        </h1>

        <p>

            Are you sure you want to remove this
            fitness progress record from your
            transformation journey?

        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="buttons">

                <button type="submit" class="btn delete-btn">

                    🔥 Yes Delete

                </button>

                <a href="/" class="btn cancel-btn">

                    ← Cancel

                </a>

            </div>

        </form>

    </div>

</body>
</html>
