<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Magical Album</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            min-height:100vh;

            background:
            linear-gradient(rgba(10,20,30,0.45), rgba(10,20,30,0.55)),
            url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            display:flex;
            justify-content:center;
            align-items:center;

           padding:40px 0;
            overflow-y:auto;

            color:white;
        }

        body::before{
            content:'';
            position:absolute;
            width:100%;
            height:100%;

            background:
            radial-gradient(circle at top right,
            rgba(255,255,255,0.2),
            transparent 30%),

            radial-gradient(circle at bottom left,
            rgba(255,220,150,0.15),
            transparent 25%);
        }

        .particles{
            position:absolute;
            width:100%;
            height:100%;
            overflow:hidden;
            z-index:1;
        }

        .particles span{
            position:absolute;
            width:8px;
            height:8px;

            background:#fff5a8;

            border-radius:50%;

            box-shadow:0 0 15px #fff5a8;

            animation:float 15s linear infinite;
        }

        .particles span:nth-child(1){
            left:10%;
            animation-duration:12s;
        }

        .particles span:nth-child(2){
            left:30%;
            animation-duration:18s;
        }

        .particles span:nth-child(3){
            left:50%;
            animation-duration:10s;
        }

        .particles span:nth-child(4){
            left:70%;
            animation-duration:20s;
        }

        .particles span:nth-child(5){
            left:90%;
            animation-duration:16s;
        }

        @keyframes float{

            0%{
                transform:translateY(100vh) scale(0);
                opacity:0;
            }

            50%{
                opacity:1;
            }

            100%{
                transform:translateY(-10vh) scale(1);
                opacity:0;
            }

        }

        .form-container{

         position:relative;
         z-index:2;

            width:90%;
            max-width:520px;

            padding:35px;

             border-radius:30px;

             background:rgba(255,255,255,0.12);

            backdrop-filter:blur(20px);

             border:1px solid rgba(255,255,255,0.18);

             box-shadow:
             0 8px 32px rgba(0,0,0,0.35),
             inset 0 0 15px rgba(255,255,255,0.1);

            animation:fadeIn 1.2s ease;
}

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .title{

            text-align:center;
            margin-bottom:40px;

        }

        .title h1{

         font-size:42px;
         margin-bottom:10px;

         text-shadow:0 10px 30px rgba(0,0,0,0.5);

}

        .title p{

            color:#f2f2f2;
            font-size:16px;
            line-height:30px;

        }

        form{

            display:flex;
            flex-direction:column;
            gap:25px;

        }

        .input-group{

            display:flex;
            flex-direction:column;
            gap:10px;

        }

        label{

            font-size:16px;
            font-weight:600;
            color:white;

        }

        input,
        textarea{

     width:100%;

        padding:14px 18px;

     border:none;

        border-radius:15px;

     outline:none;

        background:rgba(255,255,255,0.18);

     color:white;

     font-size:14px;

     backdrop-filter:blur(10px);

     border:1px solid rgba(255,255,255,0.15);

      transition:0.3s;

    }

        textarea{
         min-height:120px;
         resize:none;
        }   

        input:focus,
        textarea:focus{

            background:rgba(255,255,255,0.25);

            transform:scale(1.01);

        }

        .input-group input[type="file"]{

            padding:15px;
            cursor:pointer;
            color:white;

        }

        .submit-btn{

          padding:14px;

          border:none;

         border-radius:50px;

         background:linear-gradient(
         135deg,
         #8fd3f4,
         #84fab0
         );

            color:#222;

            font-size:16px;
         font-weight:700;

         cursor:pointer;

         transition:0.4s;

         box-shadow:0 8px 20px rgba(0,0,0,0.25);

}

        .submit-btn:hover{

            transform:translateY(-5px) scale(1.02);

            box-shadow:0 15px 30px rgba(0,0,0,0.35);

        }

        .back-btn{

            display:block;

            margin-top:25px;

            text-align:center;

            text-decoration:none;

            color:white;

            transition:0.3s;

        }

        .back-btn:hover{

            color:#ffe7a0;

        }

        @media(max-width:700px){

            .form-container{

                padding:30px;

            }

            .title h1{

                font-size:40px;

            }

        }

    </style>

</head>

<body>

    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="form-container">

        <div class="title">

            <h1> Create Album</h1>

            <p>
                Store your magical memories,
                peaceful adventures,
                warm sunsets,
                and beautiful moments forever.
            </p>

        </div>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="input-group">

                <label>Album Title</label>

                {{ form.title }}

            </div>

            <div class="input-group">

                <label>Description</label>

                {{ form.description }}

            </div>

            <div class="input-group">

                <label>Upload Magical Image</label>

                {{ form.image }}

            </div>

            <button type="submit" class="submit-btn">
                 Save Album
            </button>

        </form>

        <a href="/" class="back-btn">
            ← Back to Home
        </a>

    </div>

</body>
</html>
