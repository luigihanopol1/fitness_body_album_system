<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Fitness Progress</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            background:
            linear-gradient(rgba(0,0,0,0.75),
            rgba(0,0,0,0.85)),

            url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=2070&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:40px;

            overflow-x:hidden;

        }

        .container{

            width:100%;
            max-width:700px;

            background:rgba(20,20,20,0.78);

            backdrop-filter:blur(20px);

            border-radius:30px;

            padding:50px;

            border:1px solid rgba(255,255,255,0.08);

            box-shadow:0 8px 40px rgba(0,0,0,0.6);

            animation:fadeIn 1s ease;

        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        h1{

            text-align:center;

            color:#ff3c3c;

            font-size:60px;

            margin-bottom:20px;

            font-weight:800;

        }

        .subtitle{

            text-align:center;

            color:#ddd;

            line-height:34px;

            font-size:18px;

            margin-bottom:40px;

        }

        form{

            display:flex;
            flex-direction:column;

            gap:25px;

        }

        label{

            color:white;

            font-size:18px;

            font-weight:600;

            margin-bottom:8px;

            display:block;

        }

        input,
        textarea{

            width:100%;

            padding:18px 20px;

            border:none;

            border-radius:18px;

            background:rgba(255,255,255,0.08);

            color:white;

            font-size:16px;

            outline:none;

            transition:0.3s;

            border:1px solid transparent;

        }

        textarea{

            min-height:180px;

            resize:none;

        }

        input:focus,
        textarea:focus{

            border:1px solid #ff3c3c;

            box-shadow:0 0 20px rgba(255,60,60,0.3);

        }

        input[type="file"]{

            background:rgba(255,255,255,0.04);

            padding:15px;

            cursor:pointer;

        }

        .submit-btn{

            width:100%;

            padding:18px;

            border:none;

            border-radius:50px;

            font-size:18px;

            font-weight:700;

            cursor:pointer;

            color:white;

            background:linear-gradient(
            135deg,
            #ff3c3c,
            #ff7b00
            );

            transition:0.4s;

            box-shadow:0 8px 25px rgba(255,60,60,0.4);

        }

        .submit-btn:hover{

            transform:translateY(-5px);

            box-shadow:0 12px 35px rgba(255,60,60,0.6);

        }

        .back-btn{

            display:block;

            margin-top:20px;

            text-align:center;

            text-decoration:none;

            color:#ddd;

            transition:0.3s;

        }

        .back-btn:hover{

            color:#ff3c3c;

        }

        @media(max-width:700px){

            .container{

                padding:35px 25px;

            }

            h1{

                font-size:42px;

            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>💪 Upload Progress</h1>

        <p class="subtitle">

            Save your workouts, gym achievements,
            body transformation, fitness milestones,
            and healthy lifestyle journey.

        </p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div>

                <label>Workout Title</label>

                {{ form.title }}

            </div>

            <div>

                <label>Description</label>

                {{ form.description }}

            </div>

            <div>

                <label>Upload Fitness Image</label>

                {{ form.image }}

            </div>

            <button type="submit" class="submit-btn">

                Save Progress

            </button>

        </form>

        <a href="/" class="back-btn">

            ← Back to Fitness Dashboard

        </a>

    </div>

</body>
</html>
